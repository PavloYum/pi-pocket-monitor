name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 -m unittest discover -s server -v
      - name: Decode signing key
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - run: gradle :app:assembleRelease :app:lintRelease --no-daemon
        env:
          SIGNING_STORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - run: |
          mkdir -p downloads/0.6.1
          cp app/build/outputs/apk/release/app-release.apk downloads/0.6.1/pi-pocket-monitor-0.6.1-release.apk
          cd downloads/0.6.1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs *.apk > signing-certificate.txt
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pi-pocket-monitor-0.6.1-release
          path: downloads/0.6.1/

name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - run: |
          mkdir -p downloads/0.3.0
          cp app/build/outputs/apk/debug/app-debug.apk downloads/0.3.0/pi-pocket-monitor-0.3.0-debug.apk
          cd downloads/0.3.0
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pi-pocket-monitor-0.3.0-debug
          path: downloads/0.3.0/
